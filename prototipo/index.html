<title>Wellnexus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: consola de ingeniería. Barra lateral con los 12 módulos, área de trabajo con datos de pozo, gráficas y diagramas a escala. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface2:#F5F8FB; --line:#D4DDE7;
  --fg:#17212F; --muted:#586A7E; --accent:#3E6A94; --accent-text:#2E5A84; --accent-ink:#FFFFFF;
  --sky:#7DD3FC; --sky-soft:#DDF2FD; --node:#BFE6FB;
  --c1:#3E6A94; --c2:#CC7A22; --c3:#23895B;
  --good:#23895B; --warn:#B7791F; --crit:#C93B47;
  --earth:#D9E1E9; --steel:#46586D; --bore:#FFFFFF; --bore2:#EAF4FB; --tubstroke:#17212F; --pk:#3E6A94; --cable:#CC7A22; --pump:#7DD3FC; --perf:#C93B47;
  --display:'Sora',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(23,33,47,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --surface:#142030; --surface2:#1A2A3D; --line:#27384D;
  --fg:#E6ECF2; --muted:#93A5B8; --accent:#3E6A94; --accent-text:#7DD3FC; --sky-soft:#17344A;
  --c1:#7DD3FC; --c2:#F0A04B; --c3:#4CC38A; --good:#4CC38A; --warn:#E3B04F; --crit:#F07C86;
  --earth:#0A1119; --steel:#8FA4BB; --bore:#0F1A28; --bore2:#12263A; --tubstroke:#E6ECF2; --pk:#5B94C4; --cable:#F0A04B; --perf:#F07C86; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#142030; --surface2:#1A2A3D; --line:#27384D;
  --fg:#E6ECF2; --muted:#93A5B8; --accent:#3E6A94; --accent-text:#7DD3FC; --sky-soft:#17344A;
  --c1:#7DD3FC; --c2:#F0A04B; --c3:#4CC38A; --good:#4CC38A; --warn:#E3B04F; --crit:#F07C86;
  --earth:#0A1119; --steel:#8FA4BB; --bore:#0F1A28; --bore2:#12263A; --tubstroke:#E6ECF2; --pk:#5B94C4; --cable:#F0A04B; --perf:#F07C86; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.5rem;line-height:1.2} h2{font-size:1.05rem} h3{font-size:.92rem}
p{margin:0}
a{color:var(--accent-text)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 14px;text-decoration:none;color:var(--fg)}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font:700 1.2rem/1 var(--display);letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}
.vbar{display:none;height:3px;margin:-8px 4px 12px;border-radius:2px;background:linear-gradient(90deg,#FFCC00 33%,var(--fg) 33% 66%,#E5394B 66%)}
.v5 .vbar{display:block}
nav.mods{display:flex;flex-direction:column;gap:2px;flex:1}
nav.mods a{display:block;text-decoration:none;color:var(--fg);padding:7px 10px;border-radius:6px;border-left:3px solid transparent}
nav.mods a:hover{background:var(--surface2)}
nav.mods a[aria-current="page"]{background:var(--sky-soft);border-left-color:var(--accent);}
nav.mods a b{font:600 .88rem var(--display);display:block}
nav.mods a span{font-size:.76rem;color:var(--muted);display:block;line-height:1.3}
.sidefoot{font-size:.74rem;color:var(--muted);padding:12px 6px 0;border-top:1px solid var(--line);margin-top:10px}

.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .ttl{flex:1;min-width:0}
.top .ttl b{font:600 1rem var(--display);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:.78rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v5 .top{border-image:linear-gradient(90deg,#FFCC00 33%,var(--fg) 33% 66%,#E5394B 66%) 1;border-top-width:3px;border-top-style:solid}
.ibtn{min-height:40px;min-width:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:500}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:38px;border:0;background:var(--surface);padding:0 11px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

.page{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1280px}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:currentColor;background:transparent}.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}.chip.crit{color:var(--crit);border-color:currentColor;background:transparent}
.chip.full{background:var(--sky-soft);color:var(--accent-text);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h2{margin-bottom:10px}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font:600 1.55rem/1.2 var(--mono);font-variant-numeric:tabular-nums}
.kpi i{display:block;font-style:normal;font-size:.78rem;color:var(--muted)}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.sel td{background:var(--sky-soft)}
tbody tr[data-well]{cursor:pointer}
tbody tr[data-well]:hover td{background:var(--surface2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=search],select{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;font-size:16px;color:var(--fg);min-width:0;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.btn{min-height:40px;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:0 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
dl.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 16px;margin:0}
dl.kv dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dl.kv dd{margin:0;font-weight:500}
svg text{font-family:var(--body)}
.ax{fill:var(--muted);font-size:11px}
.lbl{fill:var(--fg);font-size:11.5px;font-weight:600}
.lbl2{fill:var(--muted);font-size:10.5px}
.chart{width:100%;height:auto;display:block}
.bar{height:10px;border-radius:3px;background:var(--c1)}
.barrow{display:grid;grid-template-columns:70px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.82rem;padding:3px 0}
.barwrap{background:var(--surface2);border-radius:3px}
.mcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--fg);padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.mcard:hover{border-color:var(--accent)}
.mcard b{font:600 1rem var(--display)}
.mcard span.d{color:var(--muted);font-size:.84rem;flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:80;max-width:calc(100% - 32px)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:block}
.drop:hover{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:70;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,17,26,.55);z-index:65}
  .menu{display:inline-flex}
  .split{grid-template-columns:minmax(0,1fr)}
  .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="root">
  <aside class="side" id="side" aria-label="Módulos">
    <a class="brand" href="#inicio" aria-label="Wellnexus, inicio">
      <svg viewBox="0 0 80 80" aria-hidden="true"><rect width="80" height="80" rx="20" fill="#3E6A94"/><polyline points="16,22 28,56 40,30 52,56 64,22" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="22" r="4.5" fill="#BFE6FB"/><circle cx="28" cy="56" r="4.5" fill="#BFE6FB"/><circle cx="52" cy="56" r="4.5" fill="#BFE6FB"/><circle cx="64" cy="22" r="4.5" fill="#BFE6FB"/><circle cx="40" cy="30" r="7" fill="#7DD3FC" stroke="#3E6A94" stroke-width="2.5"/><g class="v5mark"><rect x="14" y="65" width="17.3" height="5" fill="#FFCC00"/><rect x="31.3" y="65" width="17.3" height="5" fill="#17212F"/><rect x="48.6" y="65" width="17.4" height="5" fill="#E5394B"/></g></svg>
      <span><b>Wellnexus</b><small>Ingeniería de pozos y producción</small></span>
    </a>
    <div class="vbar"></div>
    <nav class="mods" id="nav"></nav>
    <div class="sidefoot">Prototipo navegable con datos de ejemplo. Elaborado por JH, octubre 2026.</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="ibtn menu" id="menu" aria-label="Abrir módulos"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="ttl"><b id="tt">Inicio</b><span id="ts"></span></div>
      <div class="seg hide-s" role="group" aria-label="Versión de marca"><button id="b4" aria-pressed="true" title="Versión 4, Acero y cielo">v4</button><button id="b5" aria-pressed="false" title="Versión 5, Venezuela">v5</button></div>
      <button class="ibtn" id="theme" aria-label="Cambiar tema claro u oscuro" title="Tema"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    </header>
    <main class="page" id="view"></main>
  </div>
</div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('es-CL');
const OD={20:'20"',13.375:'13⅜"',9.625:'9⅝"',7:'7"',3.5:'3½"',2.875:'2⅞"'};
const METODOS={flujo_natural:'Flujo natural',gas_lift_continuo:'Gas lift continuo',gas_lift_intermitente:'Gas lift intermitente',bombeo_mecanico:'Bombeo mecánico',bes:'BES',bcp:'BCP',plunger_lift:'Plunger lift'};
const r50=v=>Math.round(v/50)*50;

/* ---------- datos de ejemplo (ficticios) ---------- */
function mk(id,campo,yac,metodo,estado,prof,qo,agua,x,y,tod){
  const tb=r50(prof*0.9), pump=r50(prof*0.72), special=(metodo==='bes'||metodo==='bcp');
  return {id,campo,yac,metodo,estado,prof,qo,agua,x,y,pump,
    casings:[{t:'Conductor',od:20,top:0,base:350},{t:'Superficie',od:13.375,top:0,base:r50(prof*0.25)},{t:'Producción',od:9.625,top:0,base:r50(prof*0.7)},{t:'Liner',od:7,top:r50(prof*0.66),base:prof}],
    tbg:{od:tod,base:special?pump:tb}, tb, pkr:r50(tb-80),
    mand:[.25,.45,.62,.78].map(f=>r50(tb*f)),
    perf:[[r50(prof*.93),r50(prof*.96)],[r50(prof*.97),r50(prof*.99)]]};
}
const WELLS=[
  mk('CN-001','Campo Norte','Arena B-2','gas_lift_continuo','Activo',9200,420,22,18,26,3.5),
  mk('CN-002','Campo Norte','Arena B-2','gas_lift_intermitente','Activo',8800,85,35,26,40,2.875),
  mk('CN-003','Campo Norte','Arena C-1','bombeo_mecanico','Activo',6400,60,55,38,22,2.875),
  mk('CN-004','Campo Norte','Arena C-1','bes','Activo',7800,950,70,34,48,3.5),
  mk('CS-010','Campo Sur','Arena A-1','bcp','Activo',4200,140,40,62,72,2.875),
  mk('CS-011','Campo Sur','Arena A-1','plunger_lift','Activo',5600,25,10,72,80,2.875),
  mk('CS-012','Campo Sur','Arena A-2','flujo_natural','Activo',7100,310,15,52,86,3.5),
  mk('CS-013','Campo Sur','Arena A-2','gas_lift_continuo','En intervención',8300,0,0,80,66,3.5),
  mk('CE-020','Campo Este','Arena D-3','bes','Activo',9900,1250,62,84,30,3.5),
  mk('CE-021','Campo Este','Arena D-3','bombeo_mecanico','Cerrado',5200,0,0,70,14,2.875)
];
const byId=id=>WELLS.find(w=>w.id===id)||WELLS[0];
const state={well:'CN-001',brand:'v4'};
function rng(seed){let s=seed;return()=>((s=(s*1664525+1013904223)%4294967296)/4294967296)}
const stChip=e=>`<span class="chip ${e==='Activo'?'good':e==='Cerrado'?'crit':'warn'}">${e}</span>`;
function history(w){ // 36 meses de caudal, declinación exponencial con ruido
  const r=rng(w.id.charCodeAt(3)*97+w.id.charCodeAt(4)*13+w.prof), D=0.025+(w.prof%7)*0.004, q0=Math.max(w.qo,20)*Math.exp(D*35);
  return Array.from({length:36},(_,t)=>[t,Math.max(0,q0*Math.exp(-D*t)*(1+0.07*(r()-0.5)))]);
}

/* ---------- gráficos ---------- */
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));const f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
let cid=0;
function lineChart(o){
  const W=640,H=o.h||300,l=58,r=18,t=14,b=44,id='c'+(++cid);
  const sx=x=>l+x/o.xmax*(W-l-r), sy=y=>H-b-y/o.ymax*(H-t-b);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria||'Gráfica'}"><defs><clipPath id="${id}"><rect x="${l}" y="${t}" width="${W-l-r}" height="${H-t-b}"/></clipPath></defs>`;
  for(let i=0;i<=5;i++){const v=o.ymax*i/5,y=sy(v);s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${l-8}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
  for(let i=0;i<=(o.xt||6);i++){const v=o.xmax*i/(o.xt||6),x=sx(v);s+=`<text class="ax" x="${x}" y="${H-b+16}" text-anchor="middle">${fmt(v)}</text>`}
  s+=`<text class="ax" x="${(l+W-r)/2}" y="${H-6}" text-anchor="middle">${o.xl}</text><text class="ax" transform="translate(12 ${(t+H-b)/2}) rotate(-90)" text-anchor="middle">${o.yl}</text>`;
  s+=`<g clip-path="url(#${id})">`;
  o.series.forEach((se,i)=>{
    const d=se.pts.map((p,j)=>(j?'L':'M')+sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join('');
    if(se.area&&se.pts.length){s+=`<path d="${d}L${sx(se.pts[se.pts.length-1][0])},${sy(0)}L${sx(se.pts[0][0])},${sy(0)}Z" fill="${se.color}" opacity=".12"/>`}
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.w||2.2}" ${se.dash?'stroke-dasharray="6 5"':''} stroke-linejoin="round"/>`;
  });
  s+='</g>';
  (o.marks||[]).forEach(m=>{s+=`<circle cx="${sx(m.x)}" cy="${sy(m.y)}" r="5.5" fill="var(--surface)" stroke="var(--fg)" stroke-width="2.2"/><text class="lbl" x="${Math.min(sx(m.x)+10,W-110)}" y="${Math.max(sy(m.y)-10,t+12)}">${m.label}</text>`});
  return s+'</svg>';
}
function legend(items){return `<div class="legend">${items.map(i=>`<span><i style="background:${i[1]}"></i>${i[0]}</span>`).join('')}</div>`}

/* ---------- diagrama mecánico a escala ---------- */
function drawWell(w,metodo,showL,showP){
  const W=600,H=730,top=100,bot=670,cx=215;
  const maxD=Math.ceil(w.prof*1.04/500)*500, Y=d=>top+d/maxD*(bot-top);
  const cw=od=>12+od*8, tw=w.tbg.od*5+4, tb=w.tb, comps=[];
  const casAt=d=>{const c=w.casings.filter(c=>c.od<20&&d>=c.top&&d<=c.base).pop();return c||w.casings[2]};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama mecánico del pozo ${w.id}, ${METODOS[metodo]}" style="width:100%;min-width:560px;height:auto;display:block">
  <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--steel)" stroke-width="2"/></pattern></defs>`;
  // eje de profundidad
  const step=maxD>6000?2000:1000;
  s+=`<text class="ax" x="64" y="${top-12}" text-anchor="end">Prof. (ft)</text><line x1="64" x2="64" y1="${top}" y2="${bot}" stroke="var(--line)"/>`;
  for(let d=0;d<=maxD;d+=step){s+=`<line x1="58" x2="64" y1="${Y(d)}" y2="${Y(d)}" stroke="var(--muted)"/><text class="ax" x="52" y="${Y(d)+4}" text-anchor="end">${fmt(d)}</text>`}
  s+=`<rect x="${cx-146}" y="${top}" width="292" height="${bot-top}" fill="var(--earth)"/>`;
  w.casings.forEach(c=>{const x=cx-cw(c.od)/2,y1=Y(c.top),y2=Y(c.base);

    comps.push({d:m,t:`Mandril ${i+1}`,sub:`${op?'Válvula operadora':'Válvula de descarga'} · ${fmt(m)} ft`,ax:cx+tw/2+12});});
  const gasInj=()=>{s+=`<path d="M${cx-110},${top-18} H${cx-16}" stroke="var(--c2)" stroke-width="3"/><path d="M${cx-24},${top-24} l9,6 l-9,6z" fill="var(--c2)"/><text class="lbl2" x="${cx-110}" y="${top-26}">Gas de inyección</text>`};
  const head=()=>{s+=`<rect x="${cx-16}" y="${top-26}" width="32" height="26" fill="var(--steel)"/><rect x="${cx-6}" y="${top-62}" width="12" height="38" fill="var(--steel)"/><rect x="${cx+6}" y="${top-50}" width="44" height="9" fill="var(--steel)"/><line x1="${cx-146}" x2="${cx+146}" y1="${top}" y2="${top}" stroke="var(--steel)" stroke-width="2.5"/>`};
  head();

  }
  if(metodo==='flujo_natural'){pk();const y=Y(tb*0.55);s+=`<rect x="${cx-tw/2-3}" y="${y}" width="${tw+6}" height="14" fill="var(--pk)"/><line x1="${cx-tw/2}" x2="${cx+tw/2}" y1="${y+7}" y2="${y+7}" stroke="var(--bore)" stroke-width="2" stroke-dasharray="3 3"/>`;comps.push({d:tb*0.55,t:'Camisa deslizante',sub:`${fmt(tb*0.55)} ft`,ax:cx+tw/2+3});

  if(metodo==='bombeo_mecanico'){

    s+=`<line x1="${cx}" x2="${cx}" y1="${top-64}" y2="${y}" stroke="var(--steel)" stroke-width="2"/><rect x="${cx-tw/2+3}" y="${y}" width="${tw-6}" height="40" fill="var(--pump)" stroke="var(--tubstroke)"/><rect x="${cx-3}" y="${y+10}" width="6" height="20" fill="var(--tubstroke)"/>`;
    s+=`<rect x="${cx-tw/2-1}" y="${Y(tb)-10}" width="${tw+2}" height="10" fill="var(--steel)"/>`;

    const parts=[['Bomba centrífuga',38,'var(--pump)'],['Succión',10,'var(--sky)'],['Sello protector',24,'var(--pk)'],['Motor',44,'var(--c2)']];

  }
  if(metodo==='bcp'){
    const y=Y(w.pump);

    s+=`<rect x="${cx-15}" y="${y}" width="30" height="76" fill="url(#hatch)" stroke="var(--tubstroke)" stroke-width="1.5"/><path d="M${cx},${y+4} q8,6 0,12 t0,12 t0,12 t0,12 t0,12" stroke="var(--c2)" stroke-width="3" fill="none"/>`;

  }
  // etiquetas
  comps.sort((a,b)=>a.d-b.d);
  const ly=comps.map(c=>Math.max(Y(Math.max(c.d,0))+(c.d<0?0:0),c.d<0?24:0));
  comps.forEach((c,i)=>{ly[i]=c.d<0?30:Y(c.d);});
  for(let i=1;i<ly.length;i++)ly[i]=Math.max(ly[i],ly[i-1]+30);
  for(let i=ly.length-2;i>=0;i--)ly[i]=Math.min(ly[i],ly[i+1]-30);
  if(showL)comps.forEach((c,i)=>{const y0=c.d<0?top-70:Y(c.d);
    s+=`<path d="M${c.ax},${y0} L${cx+156},${y0} L${382},${ly[i]}" stroke="var(--muted)" stroke-width="1" fill="none"/><circle cx="${c.ax}" cy="${y0}" r="2.4" fill="var(--fg)"/><text class="lbl" x="388" y="${ly[i]+1}">${c.t}</text>${c.sub?`<text class="lbl2" x="388" y="${ly[i]+14}">${c.sub}</text>`:''}`;});
  return {svg:s+'</svg>',comps};
}

V.insight={t:'Insight',s:'Análisis de producción',html(){return head('insight')+`

 <div class="grid g2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)"><div class="card"><h2 id="it">Caudal de petróleo</h2><div id="ich"></div>${legend([['Historia','var(--c1)'],['Pronóstico por declinación exponencial','var(--c2)']])}</div>

 init(){const sel=$('#iw'),draw=()=>{
   let h; if(sel.value){h=history(byId(sel.value))}else{h=Array.from({length:36},(_,t)=>[t,WELLS.filter(w=>w.qo>0).reduce((a,w)=>a+history(w)[t][1],0)])}
   const n=h.length,xs=h.map(p=>p[0]),ys=h.map(p=>Math.log(p[1]+1e-6)),mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
   const b=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)*(x-mx),0),a0=my-b*mx,D=-b;

   $('#irk').innerHTML=top.map(w=>`<div class="barrow"><span class="mono">${w.id}</span><div class="barwrap"><div class="bar" style="width:${w.qo/mxq*100}%"></div></div><span class="mono" style="text-align:right">${fmt(w.qo)}</span></div>`).join('');

const F={pr:3200,qmax:2200,whp:150,glr:500,wc:20,id:2.441,adj:1,corr:'hb',depth:8000};
const CORR={hb:['Hagedorn-Brown',1],bb:['Beggs-Brill',1.08],dr:['Duns-Ros',0.95],gr:['Gray',1.03],or:['Orkiszewski',1.05]};
const iprF=q=>{const r=Math.min(q/F.qmax,1);return F.pr*((-0.2+Math.sqrt(0.04+3.2*(1-r)))/1.6)};
const vlpF=q=>{const sg=F.wc/100*1.02+(1-F.wc/100)*0.85,g=0.433*sg/(1+F.glr/800),fr=9e-7*q*q*F.depth/Math.pow(F.id,4.8);return F.whp+(g*F.depth+fr)*CORR[F.corr][1]*F.adj};
function flowDraw(){
  const N=60,ipr=[],vlp=[];for(let i=0;i<=N;i++){const q=F.qmax*i/N;ipr.push([q,iprF(q)]);vlp.push([q,vlpF(q)])}
  let op=null,msg='';
  if(vlpF(0)>=F.pr){msg='Sin flujo: con estos datos la columna pesa más que la presión del yacimiento. Sube el gas de inyección o baja el corte de agua.'}
  else{let prev=null;for(let q=0;q<=F.qmax;q+=2){const d=vlpF(q)-iprF(q);if(d>=0){op={q:q,p:iprF(q)};break}}
    if(!op){op={q:F.qmax,p:iprF(F.qmax)};msg='Limitado por el yacimiento: la curva de demanda no corta la de oferta dentro del rango.'}}
  const ymax=niceMax(Math.max(F.pr*1.05,Math.min(vlp[N][1],F.pr*1.5)));
  $('#fch').innerHTML=lineChart({xmax:F.qmax,ymax,xl:'Caudal de líquido (bpd)',yl:'Presión de fondo fluyente (psi)',aria:'Curvas de oferta y demanda del pozo',series:[{pts:ipr,color:'var(--c1)',w:2.6},{pts:vlp,color:'var(--c2)',w:2.6}],marks:op&&!(vlpF(0)>=F.pr)?[{x:op.q,y:op.p,label:'Punto de operación'}]:[]});
  $('#fres').innerHTML=op&&vlpF(0)<F.pr?`<div class="kpis"><div class="kpi"><small>Caudal</small><b>${fmt(op.q)}</b><i>bpd de líquido</i></div><div class="kpi"><small>Petróleo</small><b>${fmt(op.q*(1-F.wc/100))}</b><i>bpd</i></div><div class="kpi"><small>Presión de fondo</small><b>${fmt(op.p)}</b><i>psi</i></div><div class="kpi"><small>Gas de inyección</small><b>${fmt(op.q*F.glr/1000)}</b><i>Mscf/d aprox.</i></div></div>${msg?`<p class="muted" style="margin-top:8px">${msg}</p>`:''}`:`<p style="color:var(--crit);font-weight:500">${msg}</p>`;
}

  $('#side').classList.remove('open');$('#scrim').classList.remove('open');window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
$('#menu').addEventListener('click',()=>{$('#side').classList.add('open');$('#scrim').classList.add('open')});
$('#scrim').addEventListener('click',()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('open')});
let tt;document.addEventListener('click',e=>{const b=e.target.closest('[data-toast]');if(!b)return;document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=b.dataset.toast;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),3200)});
function setBrand(v){state.brand=v;$('#root').classList.toggle('v5',v==='v5');document.querySelectorAll('.v5mark').forEach(g=>g.style.display=v==='v5'?'':'none');$('#b4').setAttribute('aria-pressed',v==='v4');$('#b5').setAttribute('aria-pressed',v==='v5')}
$('#b4').addEventListener('click',()=>setBrand('v4'));$('#b5').addEventListener('click',()=>setBrand('v5'));
$('#theme').addEventListener('click',()=>{const d=document.documentElement,cur=d.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';d.setAttribute('data-theme',n);try{localStorage.setItem('wx-theme',n)}catch(e){}});
try{const t=localStorage.getItem('wx-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
setBrand('v4');route();
})();
